# Configuração do nginx para servir o frontend React (SPA)
# Usado internamente pelo container do frontend no Docker
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback para o React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets com hash no nome (gerados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
